name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api repos/${{ github.repository }}/compare/${{ github.sha }}...main --jq '.status')
          if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
            echo "Tagged commit is not on main"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: verify

    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
          - goarch: arm
            goarm: "7"
            artifact_arch: armhf

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o ssh-session-notifier-${{ matrix.artifact_arch || matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssh-session-notifier-${{ matrix.artifact_arch || matrix.goarch }}
          path: ssh-session-notifier-${{ matrix.artifact_arch || matrix.goarch }}

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum ssh-session-notifier-* > sha256sums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: CHANGES.md
          generate_release_notes: true
          files: |
            ssh-session-notifier-amd64
            ssh-session-notifier-arm64
            ssh-session-notifier-armhf
            sha256sums.txt
